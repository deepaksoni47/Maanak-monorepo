# ==============================================================================
# MAANAK (मानक) — Render Blueprint Infrastructure as Code
# Single-service deployment: Express API + Next.js Frontend on one instance
# ==============================================================================

services:
  - type: web
    name: maanak-monorepo
    runtime: node
    plan: free
    region: oregon
    # Build ALL packages: types → db → rules-engine → crypto-provenance → report-generator → api → web
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm run build
    # Start script orchestrates both API (port 4001) and Next.js (port 4000)
    startCommand: node scripts/start-render.mjs
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set your Neon connection string in Render Dashboard (with sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: INTERNAL_API_PORT
        value: "4001"
      - key: NEXT_PUBLIC_API_URL
        value: "https://maanak-monorepo.onrender.com"
      - key: VERIFY_BASE_URL
        value: "https://maanak-monorepo.onrender.com/verify"
